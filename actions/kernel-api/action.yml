name: Mosaikit plugin API
description: >-
  Puts io.github.mosaikit:mosaikit-kernel-api in the local Maven repository: from Maven Central when the
  version is published there, otherwise built from the Mosaikit repository (the tag of the version,
  or main for a -SNAPSHOT). Needs Java 25 and Maven on the runner. Versions built before ADR-0025
  have the group dev.mosaikit, which is still found.
inputs:
  version:
    description: Version of the plugin API, for example 0.2.0 or 0.3.0-SNAPSHOT
    required: true
outputs:
  jar:
    description: Path of the JAR, which also holds PackageSigningTool
    value: ${{ steps.api.outputs.jar }}
runs:
  using: composite
  steps:
    - id: api
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: |
        if [[ "$VERSION" != *-SNAPSHOT ]] && mvn --batch-mode --quiet --no-transfer-progress \
            dependency:get -Dartifact="io.github.mosaikit:mosaikit-kernel-api:$VERSION" -Dtransitive=false; then
          echo "mosaikit-kernel-api $VERSION from Maven Central"
        else
          ref=main; [[ "$VERSION" == *-SNAPSHOT ]] || ref="v$VERSION"
          echo "mosaikit-kernel-api $VERSION built from mosaikit/mosaikit@$ref"
          git clone --quiet --depth 1 --branch "$ref" https://github.com/mosaikit/mosaikit.git "$RUNNER_TEMP/mosaikit"
          (cd "$RUNNER_TEMP/mosaikit" && ./mvnw --batch-mode --quiet --no-transfer-progress \
            -pl sdk/java -am install -DskipTests -Dskip.npm -Dspotless.apply.skip=true)
        fi
        for group in io/github/mosaikit dev/mosaikit; do
          jar="$HOME/.m2/repository/$group/mosaikit-kernel-api/$VERSION/mosaikit-kernel-api-$VERSION.jar"
          [[ -f "$jar" ]] && break
        done
        [[ -f "$jar" ]] || { echo "::error::mosaikit-kernel-api $VERSION was not installed"; exit 1; }
        echo "jar=$jar" >> "$GITHUB_OUTPUT"
