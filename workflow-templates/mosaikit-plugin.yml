# Build, test and release a Mosaikit plugin with the reusable workflow of the organization.
# A tag vX.Y.Z (equal to the version of manifest.yaml) publishes the signed package in a release.
name: Plugin

on:
  push:
    branches: [$default-branch]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  plugin:
    uses: mosaikit/.github/.github/workflows/plugin.yml@main
    with:
      # The plugin API the plugin compiles against, and the kernels to install it into.
      mosaikit-version: 0.2.0
      kernel-images: '["v0.2.0"]'
      # Uncomment to sign releases: public key in signing/<name>.pub.pem, private key in the
      # secret PLUGIN_SIGNING_KEY (PackageSigningTool keygen).
      # signing-key-name: my-key
    secrets: inherit
