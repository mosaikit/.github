name: Bug report
description: Something does not work as expected
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to report a bug. For security vulnerabilities, do **not** use
        this form: follow the [security policy](https://github.com/mosaikit/.github/blob/main/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Install ...
        2. Open ...
        3. See the error
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The Mosaikit version, and the plugin version if the bug concerns a plugin.
      placeholder: v1.2.0
    validations:
      required: true
  - type: dropdown
    id: distribution
    attributes:
      label: Distribution
      options:
        - Container image
        - Helm chart on Kubernetes
        - Portable (Windows)
        - Portable (macOS)
        - Portable (Linux)
        - Built from source
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant log output. Remove passwords, tokens and personal data.
      render: shell
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Browser, operating system, installed plugins, screenshots, anything that may help.
