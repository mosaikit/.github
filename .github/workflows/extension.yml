#
# Reusable workflow of a Mosaikit extension: build and test, check that the kernel accepts the package,
# and on a tag vX.Y.Z sign the package and publish it in a GitHub release. An extension repository calls
# it from .github/workflows/ci.yml (see workflow-templates/mosaikit-extension.yml):
#
#   jobs:
#     extension:
#       uses: mosaikit/.github/.github/workflows/extension.yml@main
#       with:
#         mosaikit-version: 0.2.0
#         kernel-images: '["v0.2.0"]'
#         signing-key-name: acme
#       secrets: inherit
#
# The package is <id>-<version>.zip, from the id and version of manifest.yaml. An extension with a
# pom.xml is built with Maven (the package is the zip in target/); an extension without one is zipped as
# it is (manifest.yaml, web/, db/, lib/, README.md), after npm build when it has a package.json.

name: Mosaikit extension

on:
  workflow_call:
    inputs:
      mosaikit-version:
        description: Version of the Mosaikit extension API that the extension compiles against
        type: string
        required: true
      kernel-images:
        description: >-
          JSON list of tags of ghcr.io/mosaikit/mosaikit to install the package into, for example
          '["v0.2.0", "v0.3.0"]'; tags that do not exist yet are skipped with a warning
        type: string
        default: '[]'
      signing-key-name:
        description: >-
          Name of the publisher key: its public key is signing/<name>.pub.pem in the repository, its
          private key the secret EXTENSION_SIGNING_KEY. Empty: the package is not signed.
        type: string
        default: ''
      java-version:
        type: string
        default: '25'
      node-version:
        type: string
        default: '24'
    secrets:
      EXTENSION_SIGNING_KEY:
        description: Private key (PEM) of the publisher, from PackageSigningTool keygen
        required: false
    outputs:
      package:
        description: File name of the package
        value: ${{ jobs.build.outputs.package }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      package: ${{ steps.package.outputs.file }}
      name: ${{ steps.manifest.outputs.name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.m2/repository
          key: maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: maven-

      - name: Read the manifest
        id: manifest
        run: |
          id="$(yq -r '.id' manifest.yaml)"; version="$(yq -r '.version' manifest.yaml)"
          name="$(yq -r '.name' manifest.yaml)"
          if [[ -z "$id" || "$id" == null || -z "$version" || "$version" == null ]]; then
            echo "::error file=manifest.yaml::id and version are required"; exit 1
          fi
          if [[ "$GITHUB_REF" == refs/tags/v* && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error file=manifest.yaml::the tag $GITHUB_REF_NAME does not match the version $version"; exit 1
          fi
          { echo "id=$id"; echo "version=$version"; echo "name=$name"; } >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: hashFiles('package.json') != ''
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
      - name: Frontend
        if: hashFiles('package.json') != ''
        run: |
          if [[ -f package-lock.json ]]; then npm ci; else npm install --no-audit --no-fund; fi
          npm run build --if-present

      - name: Extension API
        if: hashFiles('pom.xml') != '' || (inputs.signing-key-name != '' && startsWith(github.ref, 'refs/tags/v'))
        id: api
        uses: mosaikit/.github/actions/kernel-api@main
        with:
          version: ${{ inputs.mosaikit-version }}
      - name: Backend
        if: hashFiles('pom.xml') != ''
        run: mvn --batch-mode --no-transfer-progress -Dmosaikit.version="${{ inputs.mosaikit-version }}" verify

      - name: Tests on the bench
        # The Playwright tests of the extension on the bench of @mosaikit/testing (ADR-0035 of
        # mosaikit/mosaikit), after the build: they install what was built.
        if: hashFiles('playwright.config.ts') != ''
        run: |
          npx playwright install --with-deps chromium
          npm test
      - name: Unit tests
        if: hashFiles('package.json') != '' && hashFiles('playwright.config.ts') == ''
        run: npm test --if-present

      - name: Package
        id: package
        env:
          ID: ${{ steps.manifest.outputs.id }}
          VERSION: ${{ steps.manifest.outputs.version }}
        run: |
          mkdir -p packages
          file="$ID-$VERSION.zip"
          if [[ -f pom.xml ]]; then
            built=(target/*.zip)
            [[ -f "${built[0]}" ]] || { echo "::error::the Maven build wrote no zip to target/"; exit 1; }
            cp "${built[0]}" "packages/$file"
          else
            parts=(); for p in manifest.yaml web dist db lib i18n README.md; do [[ -e "$p" ]] && parts+=("$p"); done
            zip -q -r -X "packages/$file" "${parts[@]}"
          fi
          echo "file=$file" >> "$GITHUB_OUTPUT"

      - name: Sign the package
        if: inputs.signing-key-name != '' && startsWith(github.ref, 'refs/tags/v')
        env:
          KEY_NAME: ${{ inputs.signing-key-name }}
          PRIVATE_KEY: ${{ secrets.EXTENSION_SIGNING_KEY }}
          JAR: ${{ steps.api.outputs.jar }}
        run: |
          [[ -n "$PRIVATE_KEY" ]] || { echo "::error::the secret EXTENSION_SIGNING_KEY is not set"; exit 1; }
          [[ -f "signing/$KEY_NAME.pub.pem" ]] || { echo "::error::signing/$KEY_NAME.pub.pem is missing"; exit 1; }
          keys="$RUNNER_TEMP/keys"; trusted="$RUNNER_TEMP/trusted"; mkdir -p "$keys" "$trusted"
          cp "signing/$KEY_NAME.pub.pem" "$keys/" ; cp "signing/$KEY_NAME.pub.pem" "$trusted/"
          printf '%s\n' "$PRIVATE_KEY" > "$keys/$KEY_NAME.key.pem"
          tool=(java -cp "$JAR" dev.mosaikit.kernel.api.signature.PackageSigningTool)
          "${tool[@]}" sign "$keys/$KEY_NAME" packages
          "${tool[@]}" verify "$trusted" packages
          rm -f "$keys/$KEY_NAME.key.pem"

      - name: Checksum
        run: |
          (cd packages && sha256sum ./*.zip | sed 's# \./# #' > "${{ steps.package.outputs.file }}.sha256")
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: extension-package
          path: packages/

  # The kernel accepts the package: a derived image installs it and runs `mosaikit build`, which
  # checks the manifest and its platform range and builds the Java code into the kernel.
  compatibility:
    needs: build
    if: inputs.kernel-images != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        kernel: ${{ fromJSON(inputs.kernel-images) }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: extension-package
          path: packages
      - name: Install into ghcr.io/mosaikit/mosaikit:${{ matrix.kernel }}
        env:
          IMAGE: ghcr.io/mosaikit/mosaikit:${{ matrix.kernel }}
        run: |
          if ! docker manifest inspect "$IMAGE" > /dev/null 2>&1; then
            echo "::warning::$IMAGE does not exist yet: skipped"; exit 0
          fi
          printf 'FROM %s\nCOPY --chown=185 *.zip /opt/mosaikit/extensions/\nRUN /opt/mosaikit/mosaikit build\n' "$IMAGE" > packages/Containerfile
          docker build --file packages/Containerfile packages

  release:
    needs: [build, compatibility]
    if: >-
      always() && startsWith(github.ref, 'refs/tags/v') && needs.build.result == 'success' &&
      (needs.compatibility.result == 'success' || needs.compatibility.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: extension-package
          path: packages
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ needs.build.outputs.name }}
        run: |
          pre=(); [[ "$GITHUB_REF_NAME" == *-* ]] && pre=(--prerelease)
          gh release create "$GITHUB_REF_NAME" packages/*.zip packages/*.sha256 --repo "$GITHUB_REPOSITORY" \
            --verify-tag --title "$NAME $GITHUB_REF_NAME" --generate-notes "${pre[@]}"
